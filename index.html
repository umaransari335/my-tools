<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umar Tools</title>
<style>
body{background:#0f172a;color:white;font-family:sans-serif;text-align:center;padding:15px}
.card{background:#1e293b;padding:20px;border-radius:15px;margin:15px 0}
input,textarea{width:90%;padding:12px;border-radius:8px;border:none;margin:10px 0}
button{background:#38bdf8;padding:12px;border:none;border-radius:8px;font-weight:bold;width:90%}
</style>
</head>
<body>
<h1 style="color:#38bdf8">Umar's All Tools</h1>

<div class="card">
<h2>1. Handwriting Tool</h2>
<textarea id="t" rows="4" placeholder="Yaha likho..."></textarea>
<button onclick="a()">Handwriting Banao</button>
<div id="r" style="margin-top:10px;background:#000;padding:10px;border-radius:8px"></div>
</div>

<div class="card">
<h2>2. Password Tool</h2>
<input id="n" placeholder="Naam likho">
<button onclick="b()">Password Banao</button>
<h3 id="p"></h3>
</div>

<script>
function a(){
let x=document.getElementById('t').value;
document.getElementById('r').innerHTML='<span style="font-family:cursive;font-size:22px">'+x+'</span>';
}
function b(){
let name=document.getElementById('n').value||'Umar';
let s='@#$%&';let c=s[Math.floor(Math.random()*5)];
let num=Math.floor(Math.random()*9000)+100;
document.getElementById('p').innerText=name+c+num+c+Math.floor(Math.random()*90+10);
}
</script>
</body>
</html>
