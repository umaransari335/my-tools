<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umar Tools - All in One</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:white;padding:15px}
.header{text-align:center;padding:20px 0}
.header h1{font-size:28px;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{background:#1e293b;border-radius:16px;padding:20px;margin-top:20px;border:1px solid #334155}
.upload{border:2px dashed #475569;border-radius:12px;padding:30px;text-align:center;cursor:pointer}
.upload:hover{border-color:#60a5fa;background:#1e293b}
#preview{max-width:100%;max-height:250px;margin:15px auto;display:none;border-radius:10px}
.btn{background:#3b82f6;color:white;border:none;padding:12px 20px;border-radius:10px;width:100%;font-size:16px;font-weight:600;margin-top:12px;cursor:pointer}
.btn:disabled{background:#475569}
textarea{width:100%;height:200px;background:#0f172a;border:1px solid #334155;border-radius:10px;padding:12px;color:white;margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.tool{background:#1e293b;padding:15px;border-radius:12px;text-align:center;border:1px solid #334155}
.progress{margin-top:10px;color:#94a3b8;font-size:14px}
</style>
</head>
<body>
<div class="header">
<h1>Umar Tools Hub</h1>
<p style="color:#94a3b8;margin-top:8px">Handwriting to Text + All Tools</p>
<p style="color:#64748b;font-size:12px;margin-top:4px">https://transcendent-raindrop-57c41d.netlify.app</p>
</div>

<div class="card">
<h2 style="margin-bottom:10px">✍️ Handwriting to Text (NEW)</h2>
<div class="upload" onclick="document.getElementById('file').click()">
<p>📷 Click to Upload Handwriting Photo</p>
<p style="font-size:12px;color:#94a3b8;margin-top:5px">JPG, PNG - Notebook, Paper</p>
</div>
<input type="file" id="file" accept="image/*" hidden>
<img id="preview">
<div class="progress" id="status"></div>
<button class="btn" id="convertBtn" style="display:none">Convert to Text</button>
<textarea id="result" placeholder="Converted text will appear here..."></textarea>
<button class="btn" style="background:#10b981;margin-top:8px" onclick="copyText()">📋 Copy Text</button>
</div>

<div class="grid">
<div class="tool">📝 Word Counter</div>
<div class="tool">🔤 Image to Text</div>
<div class="tool">📱 QR Generator</div>
<div class="tool">🔗 URL Short</div>
</div>

<script>
const fileInput=document.getElementById('file');
const preview=document.getElementById('preview');
const status=document.getElementById('status');
const convertBtn=document.getElementById('convertBtn');
const result=document.getElementById('result');
let selectedFile=null;

fileInput.onchange=e=>{
 selectedFile=e.target.files[0];
 if(!selectedFile)return;
 preview.src=URL.createObjectURL(selectedFile);
 preview.style.display='block';
 convertBtn.style.display='block';
 status.textContent='Image loaded. Click Convert.';
}

convertBtn.onclick=async()=>{
 if(!selectedFile)return;
 convertBtn.disabled=true;
 convertBtn.textContent='Converting...';
 status.textContent='⏳ Reading handwriting... 0%';
 result.value='';
 try{
  const {data:{text}} = await Tesseract.recognize(selectedFile,'eng', {
   logger:m=>{ if(m.status==='recognizing text'){ status.textContent=`⏳ Reading... ${Math.round(m.progress*100)}%` } }
  });
  result.value=text.trim();
  status.textContent='✅ Done! Text extracted.';
 }catch(err){
  status.textContent='❌ Error: '+err.message;
 }
 convertBtn.disabled=false;
 convertBtn.textContent='Convert to Text';
}

function copyText(){
 result.select();
 document.execCommand('copy');
 status.textContent='📋 Copied to clipboard!';
}
</script>
</body>
</html>
