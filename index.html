<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Umar - All in One Tools</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{background:#0f172a;color:white;font-family:sans-serif;margin:0;padding:15px;text-align:center}
h1{color:#38bdf8}
.card{background:#1e293b;padding:20px;border-radius:15px;margin:20px 0;border:1px solid #334155}
input,textarea{width:92%;padding:12px;border-radius:8px;border:none;margin:10px 0;font-size:15px}
button{background:#38bdf8;color:#000;padding:12px;border:none;border-radius:8px;font-weight:bold;width:92%;cursor:pointer;margin-top:5px}
#qrcode{display:flex;justify-content:center;margin-top:15px}
img{max-width:100%;border-radius:8px}
</style>
</head>
<body>
<h1>Umar's Mega Tools 🔥</h1>

<div class="card">
<h2>1. Handwriting Tool</h2>
<textarea id="t" rows="3" placeholder="Yaha likho..."></textarea>
<button onclick="hand()">Handwriting Banao</button>
<div id="r" style="margin-top:10px;background:#000;padding:10px;border-radius:8px;min-height:20px"></div>
</div>

<div class="card">
<h2>2. Password Generator</h2>
<input id="n" placeholder="Naam likho jaise Arshu">
<button onclick="pass()">Strong Password Banao</button>
<h3 id="p"></h3>
</div>

<div class="card">
<h2>3. Remove Background (Instant)</h2>
<input type="file" id="bgFile" accept="image/*">
<button onclick="removeBg()">Background Remove Karo</button>
<p style="font-size:12px;color:#94a3b8">Note: White background ko transparent karega</p>
<canvas id="canvas" style="display:none"></canvas>
<img id="bgResult" style="margin-top:10px;display:none;background: repeating-conic-gradient(#808080 0% 25%, transparent 0% 50%) 50% / 20px 20px;">
<br><a id="dlBg" style="display:none" download="no-bg.png"><button>Download PNG</button></a>
</div>

<div class="card">
<h2>4. Image to PDF</h2>
<input type="file" id="pdfFile" accept="image/*">
<button onclick="imgToPdf()">PDF Banao</button>
</div>

<div class="card">
<h2>5. QR Code Generator</h2>
<input id="qrText" placeholder="Link ya Text likho">
<button onclick="makeQR()">QR Banao</button>
<div id="qrcode"></div>
</div>

<script>
function hand(){
let x=document.getElementById('t').value;
if(!x) return alert('Kuch likho');
document.getElementById('r').innerHTML='<span style="font-family:cursive;font-size:24px">'+x+'</span>';
}
function pass(){
let name=document.getElementById('n').value||'Umar';
let s='@#$%&';let c=s[Math.floor(Math.random()*5)];
let num=Math.floor(Math.random()*9000)+100;
document.getElementById('p').innerText=name+c+num+c+(Math.floor(Math.random()*90)+10);
}
function removeBg(){
const file=document.getElementById('bgFile').files[0];
if(!file) return alert('Image select karo');
const img=new Image();
img.onload=()=>{
const canvas=document.getElementById('canvas');
canvas.width=img.width; canvas.height=img.height;
const ctx=canvas.getContext('2d');
ctx.drawImage(img,0,0);
let data=ctx.getImageData(0,0,canvas.width,canvas.height);
for(let i=0;i<data.data.length;i+=4){
if(data.data[i]>200 && data.data[i+1]>200 && data.data[i+2]>200){
data.data[i+3]=0;
}
}
ctx.putImageData(data,0,0);
const res=document.getElementById('bgResult');
res.src=canvas.toDataURL();
res.style.display='block';
const dl=document.getElementById('dlBg');
dl.href=res.src; dl.style.display='inline-block';
};
img.src=URL.createObjectURL(file);
}
function imgToPdf(){
const file=document.getElementById('pdfFile').files[0];
if(!file) return alert('Image select karo');
const reader=new FileReader();
reader.onload=(e)=>{
const {jsPDF}=window.jspdf;
const doc=new jsPDF();
doc.addImage(e.target.result,'JPEG',10,10,190,0);
doc.save('umar-image.pdf');
};
reader.readAsDataURL(file);
}
function makeQR(){
let txt=document.getElementById('qrText').value;
if(!txt) return alert('Kuch likho');
document.getElementById('qrcode').innerHTML='';
new QRCode(document.getElementById('qrcode'),{text:txt,width:200,height:200});
}
</script>
</body>
</html>
