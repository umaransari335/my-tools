<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEGA TOOLS - All Free Online Tools</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1165043619679285" crossorigin="anonymous"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,Arial}
body{background:#f5f7fb;color:#111}
header{background:#0f172a;color:#fff;padding:22px;text-align:center}
header h1{font-size:30px}
header p{opacity:.8;margin-top:6px}
.container{max-width:1100px;margin:20px auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,.07)}
.card h3{margin-bottom:12px}
.card input,.card textarea{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
.card button{width:100%;padding:11px;background:#2563eb;color:#fff;border:none;border-radius:10px;cursor:pointer;margin-top:8px;font-weight:bold}
.result{margin-top:10px;padding:10px;background:#eef2ff;border-radius:10px;font-weight:bold;min-height:40px;word-break:break-all}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<header>
<h1>🚀 MEGA TOOLS</h1>
<p>All Useful Tools in One Place - 100% Free</p>
</header>
<div class="container">
<div class="card"><h3>1. Text Repeater</h3><textarea id="repText" placeholder="Enter text"></textarea><input type="number" id="repNum" placeholder="How many times?"><button onclick="let t=document.getElementById('repText').value;let n=document.getElementById('repNum').value;document.getElementById('repResult').innerText=t.repeat(n).substring(0,5000)">Repeat</button><div id="repResult" class="result"></div></div>
<div class="card"><h3>2. Word Counter</h3><textarea id="wordText" placeholder="Paste text"></textarea><button onclick="let t=document.getElementById('wordText').value.trim();let w=t?t.split(/\s+/).length:0;document.getElementById('wordResult').innerText='Words: '+w+' | Chars: '+t.length">Count</button><div id="wordResult" class="result"></div></div>
<div class="card"><h3>3. Age Calculator</h3><input type="date" id="dob"><button onclick="let dob=new Date(document.getElementById('dob').value);let age=new Date(Date.now()-dob).getUTCFullYear()-1970;document.getElementById('ageResult').innerText='Age: '+age+' years'">Calculate</button><div id="ageResult" class="result"></div></div>
<div class="card"><h3>4. EMI Calculator</h3><input type="number" id="loan" placeholder="Loan Amount"><input type="number" id="rate" placeholder="Interest % yearly"><input type="number" id="time" placeholder="Months"><button onclick="let P=parseFloat(document.getElementById('loan').value);let R=parseFloat(document.getElementById('rate').value)/12/100;let N=parseFloat(document.getElementById('time').value);let emi=(P*R*Math.pow(1+R,N))/(Math.pow(1+R,N)-1);document.getElementById('emiResult').innerText='EMI: ₹'+emi.toFixed(2)">Calculate EMI</button><div id="emiResult" class="result"></div></div>
<div class="card"><h3>5. Fuel Cost Calculator</h3><input type="number" id="dist" placeholder="Distance KM"><input type="number" id="mil" placeholder="Mileage"><input type="number" id="price" placeholder="Petrol Price"><button onclick="let d=parseFloat(document.getElementById('dist').value);let m=parseFloat(document.getElementById('mil').value);let p=parseFloat(document.getElementById('price').value);let f=d/m;document.getElementById('fuelResult').innerText='Fuel: '+f.toFixed(2)+' L | Cost: ₹'+(f*p).toFixed(2)" style="background:#f59e0b">Calculate</button><div id="fuelResult" class="result"></div></div>
<div class="card"><h3>6. QR Generator</h3><input type="text" id="qrText" placeholder="Link or Text"><button onclick="let t=document.getElementById('qrText').value;document.getElementById('qrResult').innerHTML='<img src=https://api.qrserver.com/v1/create-qr-code/?size=150x150&data='+encodeURIComponent(t)+'>'">Generate QR</button><div id="qrResult" class="result" style="text-align:center"></div></div>
</div>
<footer>© 2026 MEGA TOOLS - Made by Umar</footer>
</body>
</html>
